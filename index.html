<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Bitácora HH</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=__V__">
</head><body>
<div id="auth" hidden>
  <form id="authForm" class="card">
    <h1>Bitácora HH</h1>
    <p class="muted">Registro de horas y actividades</p>
    <div id="regFields" hidden>
      <input id="fName" placeholder="Nombre completo" autocomplete="name">
      <input id="fUser" placeholder="Usuario" autocomplete="username">
    </div>
    <input id="fEmail" type="email" placeholder="Correo" autocomplete="email" required>
    <input id="fPass" type="password" placeholder="Contraseña" autocomplete="current-password" minlength="6" required>
    <label id="regConsent" class="chk" hidden><input type="checkbox" id="fConsent"> Acepto el uso de mis datos para llevar mi registro de horas</label>
    <button class="btn primary" id="authBtn">Ingresar</button>
    <button type="button" class="link" id="toggleMode">Crear cuenta</button>
    <button type="button" class="link" id="forgot">Olvidé mi contraseña</button>
    <p id="authMsg" class="msg"></p>
  </form>
</div>
<div id="app" hidden>
  <header>
    <div class="hi"><small id="hiSub">Bitácora HH</small><b id="hello">Hola</b></div>
    <button class="ico" id="themeBtn" title="Tema" aria-label="Tema">◐</button>
    <button class="ico" id="outBtn" title="Salir" aria-label="Salir">⎋</button>
  </header>
  <main>
    <div class="tab on" id="tab-hoy">
      <div class="daynav">
        <button class="ico" id="prev" aria-label="Día anterior">‹</button>
        <input type="date" id="dayPick">
        <button class="ico" id="next" aria-label="Día siguiente">›</button>
        <button class="chip" id="todayBtn">Hoy</button>
      </div>
      <section class="hero">
        <div><span class="big" id="tImp">0,00</span><span class="unit">h imputables</span></div>
        <div class="bar"><i id="bar"></i></div>
        <div class="meta"><span>Internas <b id="tInt">0,00 h</b></span><span>Meta <b id="tGoal">8,00 h</b></span></div>
      </section>
      <section class="panel" id="timerCard">
        <div id="timerIdle" class="stack">
          <div class="row"><select id="tProj"></select></div>
          <div class="row"><input id="tTask" placeholder="¿Qué vas a hacer?" maxlength="300"><button class="btn primary" id="tStart" aria-label="Iniciar">▶</button></div>
        </div>
        <div id="timerRun" class="stack" hidden>
          <b id="tClock" class="clock">00:00:00</b>
          <p id="tWhat" class="muted"></p>
          <button class="btn danger" id="tStop">Detener y guardar</button>
        </div>
      </section>
      <details class="panel">
        <summary>Agregar entrada manual</summary>
        <form id="mForm" class="stack">
          <select id="mProj" required></select>
          <input id="mTask" placeholder="Tarea" maxlength="300" required>
          <div class="row"><input type="time" id="mStart" step="900" required><input type="time" id="mEnd" step="900" required></div>
          <div class="row"><input id="mTicket" placeholder="Ticket (opcional)" maxlength="60"><label class="chk"><input type="checkbox" id="mImp" checked> Imputable</label></div>
          <div class="row"><button class="btn primary grow">Guardar</button><button type="button" class="btn" id="repeatBtn">Repetir última</button></div>
        </form>
      </details>
      <div class="row head"><h2>Línea de tiempo</h2><span class="sp"></span><button class="chip" id="dailyBtn">+ Daily</button></div>
      <ul id="list" class="list"></ul>
    </div>
    <div class="tab" id="tab-proy">
      <h2>Proyectos</h2>
      <form id="pForm" class="panel stack">
        <input id="pClient" placeholder="Cliente (opcional)" maxlength="100">
        <input id="pName" placeholder="Nombre del proyecto" maxlength="100" required>
        <button class="btn primary">Agregar proyecto</button>
      </form>
    </div>
    <div class="tab" id="tab-datos">
      <h2>Datos</h2>
      <section class="panel stack">
        <b>Importar semilla (CSV)</b>
        <input type="file" id="seedFile" accept=".csv">
        <p id="seedMsg" class="muted"></p>
      </section>
    </div>
    <footer>Elaborado por JH · Todos los derechos reservados · octubre 2026</footer>
  </main>
  <nav class="tabs">
    <button class="on" data-tab="hoy"><i>◷</i>Hoy</button>
    <button data-tab="proy"><i>▦</i>Proyectos</button>
    <button data-tab="datos"><i>⇅</i>Datos</button>
  </nav>
</div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=__V__"></script>
<script src="app.js?v=__V__"></script>
</body></html>
